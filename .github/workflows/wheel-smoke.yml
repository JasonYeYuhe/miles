name: Wheel smoke

# Builds the Miles sdist and wheel, installs the wheel (torchtitan extra) into a clean
# environment that has no Megatron, and runs tests/ci/wheel_smoke.py: the FSDP and torchtitan
# entry paths must import and parse their arguments from the installed wheel alone.
#
# SGLang is the sglang-miles source tree on PYTHONPATH, as in the hosted CPU stage, until a
# hosted sglang-miles wheel exists. Its runtime imports come from tests/ci/requirements-ci-cpu.txt,
# with torch overridden to the version sglang-miles pins, which the torchtitan backend needs.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout miles
        uses: actions/checkout@v4

      - name: Resolve the SGLang ref
        id: sglang
        shell: bash
        run: |
          # Release branches pin SGLang in release-lock.json; elsewhere follow the moving branch.
          if [ -f release-lock.json ]; then
            ref=$(python3 -c "import json; print(json.load(open('release-lock.json'))['sglang_commit'])")
          else
            ref=sglang-miles
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout sglang
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.sglang.outputs.ref }}
          path: sglang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Miles Docker runtime.
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the sdist and the wheel from it
        shell: bash
        run: uv build --out-dir "$RUNNER_TEMP/dist" .

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          # sglang-miles' torch pin replaces the CPU stage's; torchvision is unpinned so uv
          # picks the build that matches it.
          python3 -c "import tomllib; deps = tomllib.load(open('sglang/python/pyproject.toml', 'rb'))['project']['dependencies']; print(next(d for d in deps if d.startswith('torch==')))" \
            > "$RUNNER_TEMP/overrides.txt"
          echo torchvision >> "$RUNNER_TEMP/overrides.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install \
            "$(ls "$RUNNER_TEMP"/dist/miles-*-py3-none-any.whl)[torchtitan]" \
            -r tests/ci/requirements-ci-cpu.txt \
            --override "$RUNNER_TEMP/overrides.txt"

      - name: Run the smoke check from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}/sglang/python
        run: '"$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/ci/wheel_smoke.py" "$GITHUB_WORKSPACE"'
